name: wiki-check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generated agent files are up to date
        run: python tools/wiki.py sync --check
      - name: Index is up to date
        run: python tools/wiki.py index --check
      - name: Wiki lint (errors fail the build)
        run: python tools/wiki.py lint --quick
      - name: Framework tests (template repo only)
        if: hashFiles('tests/**') != ''
        run: python -m unittest discover -s tests -v
