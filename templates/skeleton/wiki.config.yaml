# Wiki configuration — everything specific to THIS wiki lives here.
# Framework files (AGENTS.md, .agents/, tools/, templates/, docs/) are shared across
# wikis and refreshed with `python3 tools/wiki.py upgrade` — don't put local rules there.

id: {{ID}}                     # unique, kebab-case; prefix for cross-wiki links ([[{{ID}}:slug]])
name: {{NAME}}
description: {{DESCRIPTION}}
owner: ""
audience: ""

# What belongs in this wiki (the agent uses it to decide what to extract and to route
# cross-wiki questions). Quote items that contain a colon.
scope:
  in:
{{SCOPE_IN}}
  out:
{{SCOPE_OUT}}

# Domain-specific rules the agent must follow (terminology, units, naming, tone…).
style_rules: []
# Confidentiality rules (e.g. "Never record customer names; use account ids").
confidentiality: []

# Extra page folders in wiki/ besides sources, entities, concepts, topics, analyses
# (e.g. decisions, meetings, runbooks). Create the folder and a template in templates/.
extra_categories: []

ingest:
  mode: interactive            # interactive | batch
  max_pages_touched: 15        # soft limit per source; ask before exceeding

lint:
  stale_after_days: 180

index:
  split_after: 300             # above this many pages, the index is split per section

auto_commit: false             # commit after each ingest/lint/link operation

# Linked wikis: sibling folders containing a wiki.config.yaml are discovered automatically.
link_siblings: true
exclude_wikis: []              # ids of siblings to ignore
linked_wikis: []               # wikis elsewhere: - {id: x, path: ../../other/x-wiki, repo: …}

# Where `wiki.py upgrade` gets framework updates from.
framework:
  repo: {{FRAMEWORK_REPO}}
  ref: main
